[workspace]
name = "toyos"
version = "0.1.0"
description = "ToyOS aarch64 - hobby microkernel"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

# Host environment only. Everything that runs on / links into the OS itself
# is cross-built by scripts/recipes against the aarch64-unknown-toyos triple
# (conda-forge has no packages for that target and never will).
[dependencies]
cmake = ">=3.28"
ninja = "*"
clangxx = ">=22.1,<22.2"    # toolchain; keep in lockstep with the sysroot LLVM source
lld = ">=22.1,<22.2"
llvm-tools = ">=22.1,<22.2" # llvm-strip / llvm-objcopy / llvm-nm
clang-format = ">=22.1,<22.2"
meson = "*"                 # third-party recipes still drive meson cross files
make = "*"                  # GNU make (u-boot needs it; macOS ships BSD make)
python = ">=3.12"
dtc = "*"                   # device tree (R5C)

# External, not on conda-forge (see docs/aarch64-port-arch.md "Host tools"):
#   qemu-system-aarch64 -> brew install qemu
#   mtools              -> FAT image assembly, brew install mtools
#   mkfs.ext4           -> brew install e2fsprogs (keg-only: opt/e2fsprogs/sbin)
#   rkdeveloptool       -> R5C flashing, brew or source

[pypi-dependencies]
fonttools = "*"             # pyftsubset for the font stack

[tasks]
configure = "cmake --preset aarch64"
build = { cmd = "cmake --build Build/aarch64", depends-on = ["configure"] }
# Host-tree notes: the pixi (conda-forge) clang needs an explicit macOS SDK
# sysroot, and the Xcode 27 SDK is too new for it (libSystem.tbd carries arch
# entries LLVM 22's tapi rejects) — pin the CommandLineTools 26 SDK. Build
# before ctest: gtest_discover_tests enumerates at build time.
configure-host = "cmake --preset host -DCMAKE_OSX_SYSROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX26.sdk"
build-host = { cmd = "cmake --build Build/host", depends-on = ["configure-host"] }
test-host = { cmd = "ctest --test-dir Build/host --output-on-failure", depends-on = ["build-host"] }

# In-place, tracked files only (git ls-files) — untracked editor droppings
# never sneak into a formatting commit.
format = "git ls-files '*.c' '*.h' | xargs clang-format -i"

# Sd-card boot image assembly (FAT + Image + qemu.dtb + extlinux.conf).
sdcard = { cmd = "scripts/boot/mksdcard.sh", depends-on = ["build"] }

# Fast loop: QEMU's -kernel mini-loader, HVF near-native speed.
# Exit with Ctrl-A x.
boot = { cmd = "qemu-system-aarch64 -M virt,gic-version=3 -cpu max -accel hvf -smp 4 -m 1G -nographic -kernel Build/aarch64/kernel/Image", depends-on = ["build"] }

# Headless serial smoke regression (blueprint test layer 3): boot the
# kernel, wait for the expected lines, kill QEMU. A few seconds end to
# end, so it fits the ~1-minute agent-run rule. smoke-tcg runs the same
# regression under TCG (the U-Boot-path clock, 1 GHz CNTFRQ vs 24 MHz).
smoke = { cmd = "python scripts/test/smoke.py", depends-on = ["build"] }
smoke-tcg = { cmd = "TOYOS_SMOKE_ACCEL=tcg python scripts/test/smoke.py", depends-on = ["build"] }

# Fidelity check: full U-Boot distro-boot from a virtio disk. TCG, not
# HVF — u-boot.bin from flash shows no serial output under HVF. Requires
# Build/u-boot/qemu/u-boot.bin (scripts/boot/build-uboot.sh, one-off).
# Exit with Ctrl-A x (or wait out the 2s autoboot).
boot-uboot = { cmd = "qemu-system-aarch64 -M virt,gic-version=3 -cpu max -accel tcg -smp 4 -m 1G -nographic -bios Build/u-boot/qemu/u-boot.bin -drive if=none,file=Build/boot/sd.img,format=raw,id=hd0 -device virtio-blk-device,drive=hd0", depends-on = ["sdcard"] }
